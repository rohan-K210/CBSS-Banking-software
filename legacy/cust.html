<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #2980b9;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
        }

        header h1 {
            margin: 0;
        }

        .icon-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .icon-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            background-color: #2980b9;
            width: 100px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .icon-button:hover {
            background-color: #1f6a8c;
        }

        .icon {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .icon span {
            font-size: 24px;
            color: #2980b9;
            font-weight: bold;
        }

        /* Form Styles */
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-container h2 {
            font-size: 18px;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        .form-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-container button {
            background-color: #2980b9;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .form-container button:hover {
            background-color: #1f6a8c;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Customer Management</h1>
    </header>

    <!-- Icon Buttons -->
    <div class="icon-container">
        <div class="icon-button" onclick="showForm('addForm')">
            <div class="icon">
                <span>+</span>
            </div>
            <span>Add Customer</span>
        </div>
        <div class="icon-button" onclick="showForm('editForm')">
            <div class="icon">
                <span>✎</span>
            </div>
            <span>Edit Customer</span>
        </div>
        <div class="icon-button" onclick="showForm('deleteForm')">
            <div class="icon">
                <span>✘</span>
            </div>
            <span>Delete Customer</span>
        </div>
    </div>

    <!-- Add Customer Form -->
    <div id="addForm" class="form-container">
        <h2>Add Customer</h2>
        <form>
            <label for="addName">Name:</label>
            <input type="text" id="addName" placeholder="Enter Customer Name">

            <label for="addEmail">Email:</label>
            <input type="email" id="addEmail" placeholder="Enter Customer Email">

            <label for="addPhone">Phone:</label>
            <input type="text" id="addPhone" placeholder="Enter Customer Phone">

            <button type="submit">Add Customer</button>
        </form>
    </div>

    <!-- Edit Customer Form -->
    <div id="editForm" class="form-container">
        <h2>Edit Customer</h2>
        <form>
            <label for="editId">Customer ID:</label>
            <input type="text" id="editId" placeholder="Enter Customer ID">

            <label for="editName">Name:</label>
            <input type="text" id="editName" placeholder="Enter New Name">

            <label for="editEmail">Email:</label>
            <input type="email" id="editEmail" placeholder="Enter New Email">

            <label for="editPhone">Phone:</label>
            <input type="text" id="editPhone" placeholder="Enter New Phone">

            <button type="submit">Update Customer</button>
        </form>
    </div>

    <!-- Delete Customer Form -->
    <div id="deleteForm" class="form-container">
        <h2>Delete Customer</h2>
        <form>
            <label for="deleteId">Customer ID:</label>
            <input type="text" id="deleteId" placeholder="Enter Customer ID">

            <button type="submit">Delete Customer</button>
        </form>
    </div>
</div>

<script>
    function showForm(formId) {
        document.querySelectorAll('.form-container').forEach(form => {
            form.classList.remove('active');
        });

        document.getElementById(formId).classList.add('active');
    }
</script>
</body>
</html>
