<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in | CBSS</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; color: #172033; }
    main { width: min(420px, calc(100% - 40px)); box-sizing: border-box; padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 12px 36px rgba(20, 35, 60, .10); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: #5d687a; line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd2dc; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 8px; background: #263b60; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .error { padding: 10px 12px; border-radius: 8px; background: #fff1f0; color: #a12622; }
  </style>
</head>
<body>
  <main>
    <h1>Admin sign in</h1>
    <p>Sign in to access the CBSS administration dashboard.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
